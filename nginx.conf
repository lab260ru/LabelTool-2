# LabelTool 2 — frontend nginx: SPA static files + reverse-proxy /api → backend.
# Same-origin: cookie sessions (lt2_session, SameSite=Lax) work without CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batch audio upload: files up to 200 MB + headroom
    client_max_body_size 220m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large files are streamed to the backend without being buffered to nginx disk
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 307 to a MinIO presigned URL (Location: http://localhost:9000/…)
        # is passed to the browser as-is — proxy_redirect does not rewrite it
        proxy_redirect off;
    }

    # Permanent cache for hashed Vite assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: routes /admin/*, /label/* serve index.html
    location / {
        try_files $uri /index.html;
    }
}
