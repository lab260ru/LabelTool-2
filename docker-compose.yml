# LabelTool 2 — full stack in one command: cp .env.example .env && docker compose up -d --build
#
#   http://localhost:8080  — application (nginx: SPA + proxy /api → backend)
#   http://localhost:9001  — MinIO console
#   http://localhost:9000  — MinIO S3 API (presigned URL for the browser)
#
# Settings and the super-admin account are taken from .env (see .env.example).
# By default the DB comes up EMPTY (only the super-admin). For demo data set
# SEED_DEMO=true in .env. The ${VAR:-default} values are fallbacks for a quick start.

name: labeltool2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labeltool2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labeltool2}
      POSTGRES_DB: ${POSTGRES_DB:-labeltool2}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labeltool2} -d ${POSTGRES_DB:-labeltool2}"]
      interval: 5s
      timeout: 3s
      retries: 24

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labeltool2}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-labeltool2secret}
    ports:
      - "9000:9000" # S3 API: presigned URLs from the backend point here
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24

  # One-off init: creates the bucket (idempotently) and exits
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-labeltool2} ${MINIO_ROOT_PASSWORD:-labeltool2secret} &&
        mc mb --ignore-existing local/${S3_BUCKET:-labeltool2}

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-labeltool2}:${POSTGRES_PASSWORD:-labeltool2}@postgres:5432/${POSTGRES_DB:-labeltool2}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # Initial super-admin and demo mode (see .env.example)
      SUPERUSER_LOGIN: ${SUPERUSER_LOGIN:-admin}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-change-me-admin}
      SUPERUSER_FIO: ${SUPERUSER_FIO:-Administrator}
      SEED_DEMO: ${SEED_DEMO:-false}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000                        # internal (docker network)
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_KEY: ${MINIO_ROOT_USER:-labeltool2}
      S3_SECRET: ${MINIO_ROOT_PASSWORD:-labeltool2secret}
      S3_BUCKET: ${S3_BUCKET:-labeltool2}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  miniodata:
